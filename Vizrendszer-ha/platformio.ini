; PlatformIO Project Configuration for Vizrendszer-ha
; Arduino Mega 2560 + W5100 Ethernet Shield
; Exposes 7 relay switches to Home Assistant via MQTT

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; ── Build ───────────────────────────────────────────
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -Os
    -ffunction-sections -fdata-sections
    -Wl,--gc-sections

; ── Library Dependencies ────────────────────────────
lib_deps =
    dawidchyrzynski/home-assistant-integration @ ^2.1.0
    arduino-libraries/Ethernet @ ^2.0.2
    knolleary/PubSubClient @ ^2.8

; ── Serial Monitor ──────────────────────────────────
monitor_speed = 115200
monitor_filters = direct

; ── Upload ──────────────────────────────────────────
upload_protocol = wiring
; upload_port = /dev/ttyACM0          ; uncomment and set for your system
upload_speed = 115200
